name: Validate static game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check self-contained browser game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          assert html.lstrip().lower().startswith('<!doctype html>')
          assert '<canvas' in html
          assert html.count('<script') > 0
          assert '</html>' in html
          assert 'gameCanvas' in html
          assert '出撃' in html
          assert 'https://' not in ''.join(re.findall(r'<script[^>]+src="([^"]+)"', html))
          print('Static game packaging check passed')
          PY
      - name: Extract and syntax-check JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>',html,re.S|re.I)
          assert scripts, 'Embedded JavaScript not found'
          for i,script in enumerate(scripts):
              Path(f'/tmp/rift-script-{i}.js').write_text(script,encoding='utf-8')
          print(f'Found {len(scripts)} inline scripts')
          PY
          for file in /tmp/rift-script-*.js; do node --check "$file"; done
