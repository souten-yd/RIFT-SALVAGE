name: Validate static game
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Package, compare gameplay with v0.4, and capture mobile playthrough
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mining-visual-evidence
          path: tests/evidence/
